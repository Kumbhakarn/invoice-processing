[project]
name = "docextract-backend"
version = "0.1.0"
description = "FastAPI backend for DocExtract invoice processing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "google-genai>=2.34.0",
    "openai>=3.42.0",
    "pydantic-settings>=2.6.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
docextract = "docextract.main:run"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.uv.build-backend]
module-name = "docextract"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
